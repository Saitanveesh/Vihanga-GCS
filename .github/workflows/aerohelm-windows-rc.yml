name: Vihanga Windows Installer Validation

on:
  push:
    branches: [master, vihanga-platform-integration]
    paths:
      - ".github/workflows/aerohelm-windows-rc.yml"
      - "scripts/Install-VihangaVerified.ps1"
      - "scripts/Consolidate-AeroHelmWindows.ps1"
      - "scripts/Build-Integrated-AeroHelm.ps1"
      - "scripts/Install-AeroHelmCloud.ps1"
      - "plugins/**"
      - "Plugins/AeroHelmCloud/**"
      - "Tools/AeroHelmSurveyTests/**"
      - "services/vihanga_link/**"
      - "cloud/**"
  workflow_dispatch:

concurrency:
  group: vihanga-windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/vihanga-phase3-native-toolbar' || github.ref == 'refs/heads/vihanga-platform-integration'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AEROHELM_CLOUD_READONLY: "1"
    steps:
      - name: Check out the reviewed source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Check source revision and empty runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) {
            throw 'The checked-out revision differs from the event commit.'
          }
          # The installer accepts reviewed named branches only. Attach the
          # exact event commit to the runner's local branch before invoking it.
          & git switch -C $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not establish the local release branch.'
          }
          if (Test-Path -LiteralPath 'bin/Release/net461') {
            throw 'This validation must start with an empty runtime.'
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run verified clean installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Install-VihangaVerified.ps1 -Apply
          $manifest = Get-Content -LiteralPath 'build-logs/aerohelm-consolidated-release.json' -Raw | ConvertFrom-Json
          if ($manifest.git_commit -ne $env:GITHUB_SHA -or $manifest.complete_previous_runtime_backup) {
            throw 'Clean installation did not produce evidence for the expected revision and empty runtime.'
          }
          "VIHANGA_BOOTSTRAP_EXE_SHA256=$($manifest.executable_sha256)" >> $env:GITHUB_ENV
          "VIHANGA_BOOTSTRAP_PLUGIN_SHA256=$($manifest.plugin_sha256)" >> $env:GITHUB_ENV

      - name: Rebuild existing installation and verify the preserved runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Install-VihangaVerified.ps1 -Apply
          $manifest = Get-Content -LiteralPath 'build-logs/aerohelm-consolidated-release.json' -Raw | ConvertFrom-Json
          if ($manifest.git_commit -ne $env:GITHUB_SHA -or -not $manifest.complete_previous_runtime_backup) {
            throw 'Rebuild did not produce evidence for the expected revision and a preserved runtime.'
          }
          $backup = $manifest.complete_previous_runtime_backup
          $exe = Join-Path $backup 'MissionPlanner.exe'
          $plugin = Join-Path $backup 'plugins/AeroHelm.Cloud.Plugin.Validation.dll'
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $env:VIHANGA_BOOTSTRAP_EXE_SHA256 -or
              (Get-FileHash -LiteralPath $plugin -Algorithm SHA256).Hash -ne $env:VIHANGA_BOOTSTRAP_PLUGIN_SHA256) {
            throw 'Preserved runtime differs from the verified clean installation.'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          Validated source commit: $($manifest.git_commit)

          - Clean Windows installation and binary verification
          - Existing Windows installation rebuild and binary verification
          - Previous executable and plugin hash verification in the backup

          Run Windows UI and aircraft checks separately.
          "@

      - name: Archive installer verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: vihanga-windows-installation-${{ github.sha }}
          path: build-logs/aerohelm-consolidated-release.json
          if-no-files-found: error
